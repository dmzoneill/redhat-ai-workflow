# Skill: End of Day Wrap-Up
# Your daily wrap-up assistant - wind down and prepare for tomorrow

name: beer
description: |
  End of day wrap-up - review what you accomplished and prep for tomorrow.

  This skill gathers and summarizes:
  - ✅ Wins: Commits pushed, PRs merged, issues closed
  - 📊 Stats: Lines changed, files touched
  - 🔄 WIP: Uncommitted changes, draft PRs
  - ⏰ Tomorrow: Early meetings, deadlines
  - 🧹 Cleanup: Stale branches, expiring ephemeral envs
  - 📝 Standup: Auto-generated standup notes
  - 🎯 Follow-ups: PRs needing attention tomorrow

version: "1.0"

links:
  depends_on: []            # Standalone end-of-day ritual
  validates:
    - close_issue           # EOD validates issues were properly closed
    - create_mr             # EOD validates MRs are in good state
    - cleanup_branches      # EOD shows cleaned branches
  validated_by: []          # EOD wrap-up is informational
  chains_to:
    - cleanup_branches      # Clean up stale branches
    - memory_cleanup        # Clean up stale memory entries
    - extend_ephemeral      # Extend expiring namespaces
    - standup_summary       # Generate standup notes for tomorrow
    - discovered_work_summary  # Summarize discovered work items
  provides_context_for:
    - coffee                # EOD notes inform next morning's briefing
    - standup_summary       # EOD activity for standup
    - weekly_summary        # Daily activity for weekly report

inputs:
  - name: generate_standup
    type: boolean
    required: false
    default: true
    description: "Generate standup notes for tomorrow"

  - name: cleanup_prompts
    type: boolean
    required: false
    default: true
    description: "Show cleanup reminders (branches, ephemeral)"

  - name: slack_format
    type: boolean
    required: false
    default: false
    description: "Use Slack link format"

steps:
  # ==================== LOAD DEVELOPER PERSONA ====================
  # Start with developer persona for GitLab, Git, and Jira tools
  # Will switch to devops persona for bonfire tools as needed

  - name: load_developer_persona
    description: "Load developer persona for GitLab, Git, and Jira tools"
    tool: persona_load
    args:
      persona_name: "developer"

  # ==================== KNOWLEDGE INTEGRATION ====================

  - name: get_project_patterns
    description: "Get project patterns and learnings from knowledge base"
    tool: knowledge_query
    args:
      project: "automation-analytics-backend"
      persona: "developer"
      section: "gotchas"
    output: project_knowledge_raw
    on_error: continue

  - name: parse_project_knowledge
    description: "Parse project knowledge for wrap-up context"
    compute: |
      knowledge_text = str(project_knowledge_raw) if project_knowledge_raw else ""

      gotchas = []
      patterns = []

      # Extract gotchas and patterns for summary
      if knowledge_text:
          for line in knowledge_text.split("\n"):
              line_lower = line.lower()
              if any(kw in line_lower for kw in ["gotcha", "watch out", "note", "important", "remember"]):
                  gotchas.append(line.strip()[:150])
              if any(kw in line_lower for kw in ["pattern", "convention", "best practice", "workflow"]):
                  patterns.append(line.strip()[:150])

      result = {
          "has_knowledge": len(gotchas) > 0 or len(patterns) > 0,
          "gotchas": gotchas[:5],
          "patterns": patterns[:3],
      }
    output: project_knowledge
    on_error: continue

  # ==================== PROACTIVE ISSUE DETECTION ====================

  - name: check_gitlab_known_issues
    description: "Check for known GitLab issues before starting"
    tool: check_known_issues
    args:
      tool_name: "gitlab_mr_list"
      error_text: ""
    output: gitlab_known_issues
    on_error: continue

  - name: check_calendar_known_issues
    description: "Check for known Google Calendar issues before starting"
    tool: check_known_issues
    args:
      tool_name: "google_calendar_events"
      error_text: ""
    output: calendar_known_issues
    on_error: continue

  # ==================== CONFIGURATION ====================

  - name: load_config
    description: "Load configuration using shared loader"
    compute: |
      from datetime import datetime, timedelta
      from zoneinfo import ZoneInfo
      from scripts.common.config_loader import load_config, get_timezone

      config = load_config()
      tz = ZoneInfo(get_timezone())
      now = datetime.now(tz)
      tomorrow = now + timedelta(days=1)

      # Determine greeting based on time
      hour = now.hour
      if hour < 17:
        greeting = "Wrapping up early"
        emoji = "☀️"
      elif hour < 20:
        greeting = "Cheers"
        emoji = "🍺"
      else:
        greeting = "Burning the midnight oil"
        emoji = "🌙"

      result = {
        "config": config,
        "now": now.isoformat(),
        "today": now.strftime("%Y-%m-%d"),
        "tomorrow": tomorrow.strftime("%Y-%m-%d"),
        "day_name": now.strftime("%A"),
        "tomorrow_name": tomorrow.strftime("%A"),
        "time": now.strftime("%H:%M"),
        "greeting": greeting,
        "emoji": emoji,
      }
    output: ctx

  # ==================== MEMORY CONTEXT ====================

  - name: load_current_work
    description: "Load current work state from memory"
    compute: |
      from pathlib import Path
      import yaml

      memory_file = Path.home() / "src/redhat-ai-workflow/memory/state/current_work.yaml"
      current_work = {"active_issues": [], "open_mrs": [], "follow_ups": []}

      if memory_file.exists():
          try:
              with open(memory_file) as f:
                  data = yaml.safe_load(f) or {}
              current_work["active_issues"] = data.get("active_issues", [])
              current_work["open_mrs"] = data.get("open_mrs", [])
              current_work["follow_ups"] = data.get("follow_ups", [])
          except Exception:
              pass

      result = current_work
    output: memory_work

  # ==================== TODAY'S SESSION ACTIVITY ====================

  - name: load_today_session
    description: "Parse today's enriched session log for daily report"
    compute: |
      from datetime import datetime
      from pathlib import Path
      import yaml
      import re
      from collections import defaultdict

      today = datetime.now().strftime("%Y-%m-%d")
      session_file = Path.home() / "src/redhat-ai-workflow/memory/sessions" / f"{today}.yaml"

      entries = []
      if session_file.exists():
          with open(session_file) as f:
              data = yaml.safe_load(f) or {}
          entries = data.get("entries", [])

      issue_re = re.compile(r"\b([A-Z]{2,10}-\d+)\b")

      summaries = []
      skills_run = []
      tools_logged = []
      manual_logs = []
      all_issues = set()
      all_accomplished = []
      all_decisions = []
      all_next_steps = []

      # Per-issue activity tracking for Jira comments
      issue_activity = defaultdict(list)

      for e in entries:
          etype = e.get("type", "manual")
          action = e.get("action", "")
          details = e.get("details", "")
          time_str = e.get("time", "")

          entry_issues = set()
          for text in [action, details]:
              entry_issues.update(issue_re.findall(text))
          if e.get("issues"):
              entry_issues.update(e["issues"])
          all_issues.update(entry_issues)

          activity_line = f"[{time_str}] {action}"
          if details:
              activity_line += f" - {details[:100]}"

          for issue_key in entry_issues:
              issue_activity[issue_key].append(activity_line)

          if etype == "summary":
              summaries.append(e)
              all_accomplished.extend(e.get("accomplished", []))
              all_decisions.extend(e.get("decisions", []))
              all_next_steps.extend(e.get("next_steps", []))
              for issue_key in entry_issues:
                  for item in e.get("accomplished", []):
                      issue_activity[issue_key].append(f"  Accomplished: {item}")
          elif etype == "skill":
              skills_run.append(e)
          elif etype == "tool":
              tools_logged.append(e)
          elif etype == "manual":
              manual_logs.append(e)

      result = {
          "has_session": bool(entries),
          "entry_count": len(entries),
          "summaries": summaries,
          "skills_run": skills_run,
          "tools_logged": tools_logged,
          "manual_logs": manual_logs,
          "all_issues": sorted(all_issues),
          "all_accomplished": all_accomplished,
          "all_decisions": all_decisions,
          "all_next_steps": all_next_steps,
          "issue_activity": dict(issue_activity),
          "session_count": len([e for e in entries if e.get("type") == "session" and "started" in e.get("action", "").lower()]),
          "date": today,
      }
    output: today_session

  # ==================== TODAY'S COMMITS ====================

  - name: get_todays_commits
    description: "Get commits you pushed today"
    tool: git_log
    args:
      repo: "automation-analytics-backend"
      author: "{{ ctx.config.user.username }}"
      since: "{{ ctx.today }}"
      limit: 20
    output: todays_commits_raw
    on_error: continue

  - name: parse_todays_commits
    description: "Parse today's commits"
    compute: |
      import re

      commits = []
      raw = str(todays_commits_raw) if todays_commits_raw else ""

      for line in raw.split('\n'):
        match = re.search(r'`([a-f0-9]{7,})\s+(.+?)`', line)
        if match:
          commits.append({
            "sha": match.group(1)[:7],
            "message": match.group(2)[:60]
          })

      # Calculate stats
      result = {
        "commits": commits,
        "count": len(commits)
      }
    output: todays_work
    on_error: continue

  # ==================== UNCOMMITTED CHANGES ====================

  - name: check_uncommitted
    description: "Check for uncommitted work"
    compute: |
      # Will be populated by subsequent tool calls
      result = []
    output: uncommitted_init

  - name: check_backend_status
    description: "Check backend repo for uncommitted changes"
    tool: git_status
    args:
      repo: "automation-analytics-backend"
    output: backend_status_raw
    on_error: continue

  - name: check_workflow_status
    description: "Check workflow repo for uncommitted changes"
    tool: git_status
    args:
      repo: "redhat-ai-workflow"
    output: workflow_status_raw
    on_error: continue

  - name: parse_uncommitted
    description: "Parse uncommitted changes from both repos"
    compute: |
      uncommitted = []

      for repo_name, status_raw in [
        ("automation-analytics-backend", backend_status_raw if 'backend_status_raw' in dir() else None),
        ("redhat-ai-workflow", workflow_status_raw if 'workflow_status_raw' in dir() else None),
      ]:
        if not status_raw:
          continue
        status_text = str(status_raw)
        # Look for modified/added/deleted files in the output
        if "modified:" in status_text or "new file:" in status_text or "deleted:" in status_text:
          # Count changes
          lines = [l.strip() for l in status_text.split('\n') if 'modified:' in l or 'new file:' in l or 'deleted:' in l]
          if lines:
            uncommitted.append({
              "repo": repo_name,
              "files": len(lines),
              "changes": lines[:5]
            })

      result = uncommitted
    output: uncommitted_changes

  # ==================== TODAY'S MERGED PRs ====================

  - name: get_merged_today
    description: "Get PRs merged today"
    tool: gitlab_mr_list
    args:
      project: "automation-analytics/automation-analytics-backend"
      state: "merged"
    output: merged_mrs_raw
    on_error: auto_heal  # GitLab API - may need auth refresh

  - name: parse_merged_today
    description: "Filter for today's merges only"
    compute: |
      from scripts.common.parsers import parse_mr_list
      from datetime import datetime
      import re

      all_merged = parse_mr_list(merged_mrs_raw) if merged_mrs_raw else []
      today = ctx.get('today', datetime.now().strftime("%Y-%m-%d"))

      # The gitlab_mr_list output doesn't include merge dates in parsed format
      # We need to check the raw output for merge timestamps
      raw = str(merged_mrs_raw) if merged_mrs_raw else ""

      # For now, we can't reliably filter by date from the MR list output
      # The API returns recently merged MRs but doesn't show merge date in list view
      # So we'll be conservative and show nothing unless we can confirm today's date
      # This is better than showing wrong data

      # Check if it's a weekend - typically no merges
      day_name = ctx.get('day_name', datetime.now().strftime("%A"))
      if day_name in ['Saturday', 'Sunday']:
          # Weekends typically have no merges
          result = []
      else:
          # On weekdays, show recent merges but note they may not be from today
          # TODO: Enhance gitlab_mr_list to return merge timestamps
          result = all_merged[:5]
    output: merged_today
    on_error: continue

  # ==================== MY OPEN PRs STATUS ====================

  - name: get_my_prs
    description: "Get my open PRs"
    tool: gitlab_mr_list
    args:
      project: "automation-analytics/automation-analytics-backend"
      author: "@me"
    output: my_prs_raw
    on_error: auto_heal  # GitLab API - may need auth refresh

  - name: parse_my_prs
    description: "Parse my open PRs using shared parser"
    compute: |
      from scripts.common.parsers import parse_mr_list

      prs = parse_mr_list(my_prs_raw) if my_prs_raw else []

      # Enrich with draft status
      raw = str(my_prs_raw) if my_prs_raw else ""
      for pr in prs:
        pr_id = str(pr.get('id', ''))
        for line in raw.split('\n'):
          if f"!{pr_id}" in line:
            pr['draft'] = 'draft' in line.lower()
            break

      result = prs
    output: my_prs
    on_error: continue

  # ==================== TOMORROW'S CALENDAR ====================

  - name: get_tomorrows_calendar
    description: "Fetch tomorrow's calendar events"
    compute: |
      from pathlib import Path
      from datetime import datetime, timedelta
      from zoneinfo import ZoneInfo
      import os

      # Read config_dir from config.json, fallback to default
      gc_config = ctx.get('config', {}).get('google_calendar', {})
      config_dir = gc_config.get('config_dir', '~/.config/google_calendar')
      CONFIG_DIR = Path(os.path.expanduser(config_dir))
      TOKEN_FILE = CONFIG_DIR / "token.json"
      TIMEZONE = "Europe/Dublin"
      tz = ZoneInfo(TIMEZONE)

      events_tomorrow = []

      if TOKEN_FILE.exists():
        try:
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials.from_authorized_user_file(str(TOKEN_FILE))
          service = build('calendar', 'v3', credentials=creds)

          # Get tomorrow's events
          tomorrow = datetime.now(tz) + timedelta(days=1)
          start = tomorrow.replace(hour=0, minute=0, second=0).isoformat()
          end = tomorrow.replace(hour=23, minute=59, second=59).isoformat()

          events = service.events().list(
            calendarId='primary',
            timeMin=start,
            timeMax=end,
            singleEvents=True,
            orderBy='startTime'
          ).execute().get('items', [])

          for event in events[:10]:
            start_time = event['start'].get('dateTime', event['start'].get('date', ''))
            if 'T' in start_time:
              time_str = start_time[11:16]
            else:
              time_str = 'All day'

            events_tomorrow.append({
              "time": time_str,
              "title": event.get('summary', 'No title')[:40],
              "meet_link": event.get('hangoutLink', ''),
              "early": time_str < '10:00' if time_str != 'All day' else False
            })
        except Exception as e:
          events_tomorrow = [{"error": str(e)}]

      result = events_tomorrow
    output: tomorrow_calendar
    on_error: continue

  # ==================== EPHEMERAL CLEANUP ====================
  # Switch to devops persona for bonfire tools

  - name: load_devops_persona_for_ephemeral
    description: "Load devops persona for Bonfire tools"
    tool: persona_load
    args:
      persona_name: "devops"

  - name: check_ephemeral
    description: "Check ephemeral namespaces for cleanup"
    tool: bonfire_namespace_list
    args:
      mine: true
    output: ephemeral_raw
    on_error: auto_heal  # Ephemeral cluster - may need kube_login

  - name: parse_ephemeral
    description: "Parse ephemeral namespaces"
    compute: |
      from scripts.common.parsers import parse_namespaces

      result = parse_namespaces(ephemeral_raw) if ephemeral_raw else []
    output: ephemeral_namespaces
    on_error: continue

  # ==================== STALE BRANCHES ====================

  - name: get_merged_branches
    description: "Get branches merged into main"
    tool: git_branch_list
    args:
      repo: "automation-analytics-backend"
      merged: "main"
    output: merged_branches_raw
    on_error: continue

  - name: parse_stale_branches
    description: "Extract stale branches (merged but not main/master)"
    compute: |
      stale_branches = []
      raw = str(merged_branches_raw) if 'merged_branches_raw' in dir() and merged_branches_raw else ""

      for line in raw.split('\n'):
        # Parse branch name from output
        if '`' in line:
          # Format: → `branch-name` or   `branch-name`
          import re
          match = re.search(r'`([^`]+)`', line)
          if match:
            branch = match.group(1)
            if branch and branch not in ['main', 'master', 'HEAD']:
              stale_branches.append(branch)

      result = stale_branches[:5]  # Top 5
    output: stale_branches

  # ==================== GENERATE STANDUP ====================

  - name: generate_standup_notes
    description: "Generate standup notes for tomorrow"
    condition: "inputs.get('generate_standup', True)"
    compute: |
      from scripts.common.parsers import linkify_jira_keys, linkify_mr_ids
      is_slack = inputs.get('slack_format', False)
      lines = []

      # Yesterday (what I did today)
      lines.append("**Yesterday:**")
      if todays_work and todays_work.get('commits'):
        for c in todays_work['commits'][:3]:
          msg = linkify_jira_keys(c['message'], slack_format=is_slack)
          lines.append(f"- {msg}")
      else:
        lines.append("- (no commits today)")

      # Today (what I'll work on)
      lines.append("")
      lines.append("**Today:**")
      if my_prs:
        for pr in my_prs[:2]:
          if not pr.get('draft'):
            title = linkify_jira_keys(pr['title'], slack_format=is_slack)
            mr_id = linkify_mr_ids(f"!{pr['id']}", slack_format=is_slack)
            lines.append(f"- Continue {mr_id}: {title}")
            break
      else:
        lines.append("- (check Jira board)")

      # Blockers
      lines.append("")
      lines.append("**Blockers:**")
      lines.append("- None")

      result = '\n'.join(lines)
    output: standup_notes
    on_error: continue

  # ==================== WEEKLY STATS ====================

  - name: get_weekly_commits
    description: "Get commits from the past week"
    tool: git_log
    args:
      repo: "automation-analytics-backend"
      since: "1 week ago"
      author: "{{ ctx.config.user.username }}"
      limit: 100
      oneline: true
    output: weekly_commits_raw
    on_error: continue

  - name: get_weekly_numstat
    description: "Get line change stats for the week"
    tool: git_log
    args:
      repo: "automation-analytics-backend"
      since: "1 week ago"
      author: "{{ ctx.config.user.username }}"
      limit: 100
      numstat: true
    output: weekly_numstat_raw
    on_error: continue

  - name: parse_weekly_stats
    description: "Parse weekly activity stats"
    compute: |
      stats = {
        "commits_this_week": 0,
        "lines_added": 0,
        "lines_removed": 0,
      }

      # Count commits
      commits_raw = str(weekly_commits_raw) if 'weekly_commits_raw' in dir() and weekly_commits_raw else ""
      if commits_raw:
        # Count lines that look like commits (short SHA followed by message)
        import re
        commit_lines = [l for l in commits_raw.split('\n') if re.match(r'^[a-f0-9]{7,}', l.strip())]
        stats["commits_this_week"] = len(commit_lines)

      # Parse numstat
      numstat_raw = str(weekly_numstat_raw) if 'weekly_numstat_raw' in dir() and weekly_numstat_raw else ""
      for line in numstat_raw.split('\n'):
        parts = line.split('\t')
        if len(parts) >= 2:
          try:
            added = parts[0].strip()
            removed = parts[1].strip()
            if added.isdigit():
              stats["lines_added"] += int(added)
            if removed.isdigit():
              stats["lines_removed"] += int(removed)
          except Exception:
            pass  # Ignore non-numeric diff stat lines

      result = stats
    output: weekly_stats

  # ==================== FORMAT BRIEFING ====================

  - name: format_briefing
    description: "Create the end of day wrap-up"
    compute: |
      import re

      lines = []

      # Get user's first name from config
      full_name = ctx.get('config', {}).get('user', {}).get('full_name', 'there')
      first_name = full_name.split()[0] if full_name else 'there'

      # Base URL for GitLab MRs
      gitlab_mr_base = "https://gitlab.cee.redhat.com/automation-analytics/automation-analytics-backend/-/merge_requests"

      # Import shared linkify functions
      from scripts.common.parsers import linkify_jira_keys, linkify_mr_ids

      is_slack = inputs.get('slack_format', False)

      def build_link(url, text):
          if is_slack:
              return f"<{url}|{text}>"
          return f"[{text}]({url})"

      # Header
      lines.append(f"# {ctx['emoji']} {ctx['greeting']}, {first_name}!")
      lines.append("")
      lines.append(f"**{ctx['day_name']}, {ctx['today']}** | {ctx['time']} Irish time")
      lines.append("")
      lines.append("---")
      lines.append("")

      # Today's Wins
      lines.append("## ✅ Today's Wins")
      if todays_work and todays_work.get('count', 0) > 0:
        lines.append(f"**{todays_work['count']}** commits pushed:")
        for c in todays_work.get('commits', [])[:5]:
          msg = linkify_jira_keys(c['message'], slack_format=is_slack)
          lines.append(f"- `{c['sha']}` {msg}")
      else:
        lines.append("- No commits today (and that's okay! 🎄)")
      lines.append("")

      # Today's Merges
      day_name = ctx.get('day_name', '')
      is_weekend = day_name in ['Saturday', 'Sunday']

      lines.append("## 🚀 Merged Today")
      if is_weekend:
        lines.append("- No MRs merged (it's the weekend! 🎉)")
      elif merged_today:
        lines.append(f"*{len(merged_today)} recent merge(s):*")
        for mr in merged_today:
          title = linkify_jira_keys(mr['title'], slack_format=is_slack)
          url = f"{gitlab_mr_base}/{mr['id']}"
          lines.append(f"- {build_link(url, '!' + str(mr['id']))} - {title}")
      else:
        lines.append("- No MRs merged today")
      lines.append("")

      # Weekly Stats
      lines.append("## 📊 This Week's Stats")
      if weekly_stats:
        lines.append(f"- **{weekly_stats.get('commits_this_week', 0)}** commits")
        lines.append(f"- **+{weekly_stats.get('lines_added', 0)}** / **-{weekly_stats.get('lines_removed', 0)}** lines")
      else:
        lines.append("- Stats unavailable")
      lines.append("")

      # Uncommitted Work
      if uncommitted_changes:
        lines.append("## 🔄 Uncommitted Work")
        lines.append("⚠️ Don't forget to commit or stash:")
        for uc in uncommitted_changes:
          lines.append(f"- **{uc['repo']}**: {uc['files']} changed files")
        lines.append("")

      # Open PRs
      lines.append("## 🔀 Your Open PRs")
      if my_prs:
        drafts = [p for p in my_prs if p.get('draft')]
        active = [p for p in my_prs if not p.get('draft')]
        lines.append(f"**{len(active)}** active, **{len(drafts)}** draft")
        for pr in active[:3]:
          title_with_links = linkify_jira_keys(pr.get('title', ''), slack_format=is_slack)
          url = f"{gitlab_mr_base}/{pr['id']}"
          lines.append(f"- {build_link(url, '!' + str(pr['id']))} - {title_with_links}")
      else:
        lines.append("- No open PRs")
      lines.append("")

      # Tomorrow's Calendar
      lines.append("## ⏰ Tomorrow's Schedule")
      if isinstance(tomorrow_calendar, list):
        has_errors = any('error' in str(e) for e in tomorrow_calendar)
        if has_errors:
          lines.append("- Calendar not accessible")
        elif tomorrow_calendar:
          early_meetings = [e for e in tomorrow_calendar if e.get('early')]
          if early_meetings:
            lines.append("**⚠️ Early meetings:**")
            for e in early_meetings:
              lines.append(f"- **{e['time']}** {e['title']} 📹")

          for e in tomorrow_calendar[:5]:
            if not e.get('early'):
              meet = "📹" if e.get('meet_link') else ""
              lines.append(f"- {e['time']} - {e['title']} {meet}")
        else:
          lines.append("- No meetings tomorrow! 🎉")
      else:
        lines.append("- Calendar not accessible")
      lines.append("")

      # Cleanup Reminders
      if inputs.get('cleanup_prompts', True):
        cleanup_items = []

        if ephemeral_namespaces:
          for ns in ephemeral_namespaces:
            cleanup_items.append(f"🧪 Release `{ns['name']}`? (expires {ns['expires']})")

        if stale_branches:
          for br in stale_branches[:3]:
            cleanup_items.append(f"🌿 Delete merged branch `{br}`?")

        if cleanup_items:
          lines.append("## 🧹 Cleanup Reminders")
          for item in cleanup_items:
            lines.append(f"- {item}")
          lines.append("")

      # Follow-ups from Memory
      follow_ups = memory_work.get('follow_ups', []) if memory_work else []
      if follow_ups:
        lines.append("## 📌 Follow-ups (from memory)")
        for fu in follow_ups[:5]:
          task = fu.get('task', 'Unknown task')
          priority = fu.get('priority', 'normal')
          due = fu.get('due', '')
          emoji = "🔴" if priority == "high" else "🟡" if priority == "medium" else "⚪"
          due_str = f" (due: {due})" if due else ""
          lines.append(f"- {emoji} {task}{due_str}")
        lines.append("")

      # Today's Session Activity (from enriched session logs)
      if today_session and today_session.get('has_session'):
        ts = today_session
        lines.append("## 📊 Session Activity")

        stats_parts = []
        if ts.get('session_count'):
          stats_parts.append(f"{ts['session_count']} sessions")
        if ts.get('skills_run'):
          successful = len([s for s in ts['skills_run'] if s.get('result') == 'success'])
          stats_parts.append(f"{len(ts['skills_run'])} skills ({successful} ok)")
        if ts.get('tools_logged'):
          stats_parts.append(f"{len(ts['tools_logged'])} significant actions")
        if ts.get('manual_logs'):
          stats_parts.append(f"{len(ts['manual_logs'])} manual logs")
        if stats_parts:
          lines.append(f"**Activity:** {', '.join(stats_parts)} ({ts.get('entry_count', 0)} total entries)")

        if ts.get('all_accomplished'):
          lines.append("**Accomplished (from session summaries):**")
          for item in ts['all_accomplished'][:8]:
            lines.append(f"- {item}")

        if ts.get('all_issues'):
          issue_links = []
          for key in ts['all_issues'][:10]:
            url = f"https://issues.redhat.com/browse/{key}"
            issue_links.append(build_link(url, key))
          lines.append(f"**Issues touched:** {', '.join(issue_links)}")

        if ts.get('all_decisions'):
          lines.append("**Decisions made:**")
          for item in ts['all_decisions'][:5]:
            lines.append(f"- {item}")

        lines.append("")

      # Standup Notes
      if standup_notes:
        lines.append("## 📝 Tomorrow's Standup (ready to paste)")
        lines.append("```")
        lines.append(standup_notes)
        lines.append("```")
        lines.append("")

      # Sign off
      lines.append("---")
      lines.append("")

      # Fun sign-off based on day
      day = ctx['day_name']
      if day == 'Friday':
        lines.append("🍻 **Happy Friday!** Have a great weekend!")
      elif day == 'Thursday':
        lines.append("🍺 Almost there! One more day to Friday.")
      else:
        lines.append("🍺 Have a good evening!")

      result = '\n'.join(lines)
    output: briefing

  # ==================== JIRA DAILY UPDATE (WITH CONFIRMATION) ====================

  - name: draft_jira_comments
    description: "Draft Jira comments for each issue worked on today"
    condition: "today_session and today_session.get('all_issues')"
    compute: |
      from datetime import datetime

      issue_activity = today_session.get('issue_activity', {})
      accomplished = today_session.get('all_accomplished', [])
      today_str = datetime.now().strftime("%Y-%m-%d")

      drafts = []
      for issue_key in today_session.get('all_issues', []):
          activities = issue_activity.get(issue_key, [])
          if not activities and not accomplished:
              continue

          comment_lines = [f"AI Work Summary for {today_str}:"]
          if activities:
              for act in activities[:10]:
                  comment_lines.append(f"- {act}")
          elif accomplished:
              for item in accomplished[:5]:
                  comment_lines.append(f"- {item}")

          drafts.append({
              "issue_key": issue_key,
              "comment": "\n".join(comment_lines),
          })

      result = drafts
    output: jira_drafts

  - name: confirm_jira_updates
    description: "Show Jira comment drafts and ask for confirmation"
    condition: "jira_drafts and len(jira_drafts) > 0"
    compute: |
      lines = ["## Jira Comment Drafts\n"]
      lines.append(f"The following comments will be posted to **{len(jira_drafts)}** Jira issues:\n")
      for draft in jira_drafts:
          lines.append(f"### {draft['issue_key']}")
          lines.append("```")
          lines.append(draft['comment'])
          lines.append("```")
          lines.append("")
      lines.append("**Post these comments to Jira?**")
      result = "\n".join(lines)
    output: jira_confirmation_prompt

  - name: ask_jira_confirmation
    description: "Ask user to confirm Jira updates"
    condition: "jira_drafts and len(jira_drafts) > 0"
    tool: ask_question
    args:
      question: "{{ jira_confirmation_prompt }}"
      options: "yes,no"
    output: jira_confirmed
    on_error: continue

  - name: post_jira_comments
    description: "Post confirmed Jira comments"
    condition: "jira_confirmed and 'yes' in str(jira_confirmed).lower() and jira_drafts"
    compute: |
      posted = []
      errors = []

      for draft in jira_drafts:
          try:
              tool_result = tools.call("jira_add_comment",
                  issue_key=draft["issue_key"],
                  comment=draft["comment"]
              )
              posted.append(draft["issue_key"])
          except Exception as e:
              errors.append(f"{draft['issue_key']}: {e}")

      result = {
          "posted": posted,
          "errors": errors,
          "skipped": not bool(posted) and not bool(errors),
      }
    output: jira_post_result
    on_error: continue

  # ==================== SLACK DAILY SUMMARY (WITH CONFIRMATION) ====================

  - name: draft_slack_summary
    description: "Draft a Slack summary of the day for team chat"
    condition: "today_session and today_session.get('has_session')"
    compute: |
      from datetime import datetime

      ts = today_session
      today_str = datetime.now().strftime("%Y-%m-%d")
      day_name = ctx.get('day_name', '')

      slack_lines = [f"*Daily Update - {day_name} {today_str}*\n"]

      if todays_work and todays_work.get('count', 0) > 0:
          slack_lines.append(f"*Commits:* {todays_work['count']}")

      if merged_today:
          slack_lines.append(f"*Merged:* {len(merged_today)} MR(s)")

      if ts.get('all_accomplished'):
          slack_lines.append("\n*Accomplished:*")
          for item in ts['all_accomplished'][:5]:
              slack_lines.append(f"  - {item}")

      if ts.get('all_issues'):
          issue_links = [f"<https://issues.redhat.com/browse/{k}|{k}>" for k in ts['all_issues'][:8]]
          slack_lines.append(f"\n*Issues:* {', '.join(issue_links)}")

      if ts.get('all_decisions'):
          slack_lines.append("\n*Key decisions:*")
          for item in ts['all_decisions'][:3]:
              slack_lines.append(f"  - {item}")

      if ts.get('all_next_steps'):
          slack_lines.append("\n*Tomorrow:*")
          for item in ts['all_next_steps'][:3]:
              slack_lines.append(f"  - {item}")

      result = "\n".join(slack_lines)
    output: slack_draft

  - name: confirm_slack_post
    description: "Show Slack draft and ask for confirmation"
    condition: "slack_draft"
    compute: |
      lines = ["## Slack Summary Draft\n"]
      lines.append("The following will be posted to the team channel:\n")
      lines.append("```")
      lines.append(slack_draft)
      lines.append("```")
      lines.append("\n**Post this to Slack?**")
      result = "\n".join(lines)
    output: slack_confirmation_prompt

  - name: ask_slack_confirmation
    description: "Ask user to confirm Slack post"
    condition: "slack_draft"
    tool: ask_question
    args:
      question: "{{ slack_confirmation_prompt }}"
      options: "yes,no"
    output: slack_confirmed
    on_error: continue

  - name: post_slack_summary
    description: "Post confirmed Slack summary to team channel"
    condition: "slack_confirmed and 'yes' in str(slack_confirmed).lower() and slack_draft"
    compute: |
      try:
          channel = ctx.get('config', {}).get('slack', {}).get('team_channel', 'aa-api-team')
          tool_result = tools.call("slack_send_message",
              channel=channel,
              message=slack_draft
          )
          result = {"posted": True, "channel": channel}
      except Exception as e:
          result = {"posted": False, "error": str(e)}
    output: slack_post_result
    on_error: continue

  # ==================== MEMORY UPDATES ====================

  - name: log_beer_session
    description: "Log end of day wrap-up to session"
    tool: memory_session_log
    args:
      action: "End of day wrap-up (beer)"
      details: "Commits: {{ todays_work.count if todays_work else 0 }}, PRs: {{ my_prs | length if my_prs else 0 }}"
    on_error: continue

  - name: update_work_state
    description: "Sync memory with actual work state at end of day"
    compute: |
      from datetime import datetime

      # Update current work with fresh data
      current_work = memory.read_memory("state/current_work") or {}

      # Save today's summary
      if "daily_summaries" not in current_work:
          current_work["daily_summaries"] = []

      current_work["daily_summaries"].append({
          "date": ctx.get("today", datetime.now().strftime("%Y-%m-%d")),
          "commits": todays_work.get("count", 0) if todays_work else 0,
          "open_prs": len(my_prs) if my_prs else 0,
          "merged_today": len(merged_today) if merged_today else 0,
          "uncommitted_repos": len(uncommitted_changes) if uncommitted_changes else 0,
      })

      # Keep last 30 days
      current_work["daily_summaries"] = current_work["daily_summaries"][-30:]

      current_work["last_beer"] = datetime.now().isoformat()

      memory.write_memory("state/current_work", current_work)
      result = "work state synced for EOD"
    output: work_sync_result
    on_error: continue

  - name: learn_daily_patterns
    description: "Learn from daily activity patterns"
    compute: |
      from datetime import datetime

      # Load patterns
      patterns = memory.read_memory("learned/patterns") or {}
      if "daily_patterns" not in patterns:
          patterns["daily_patterns"] = []

      # Record today's pattern
      day_record = {
          "date": ctx.get("today", datetime.now().strftime("%Y-%m-%d")),
          "day_of_week": ctx.get("day_name", datetime.now().strftime("%A")),
          "commits": todays_work.get("count", 0) if todays_work else 0,
          "weekly_commits": weekly_stats.get("commits_this_week", 0) if weekly_stats else 0,
          "lines_added": weekly_stats.get("lines_added", 0) if weekly_stats else 0,
          "lines_removed": weekly_stats.get("lines_removed", 0) if weekly_stats else 0,
          "stale_branches": len(stale_branches) if stale_branches else 0,
          "ephemeral_envs": len(ephemeral_namespaces) if ephemeral_namespaces else 0,
      }

      patterns["daily_patterns"].append(day_record)

      # Keep last 90 days
      patterns["daily_patterns"] = patterns["daily_patterns"][-90:]

      memory.write_memory("learned/patterns", patterns)
      result = "daily patterns learned"
    output: pattern_learn_result
    on_error: continue

  - name: save_standup_for_tomorrow
    description: "Save standup notes for tomorrow morning"
    condition: "standup_notes"
    compute: |
      from datetime import datetime, timedelta

      # Save standup for tomorrow's coffee
      shared = memory.read_memory("state/shared_context") or {}

      tomorrow = (datetime.now() + timedelta(days=1)).strftime("%Y-%m-%d")
      shared["prepared_standup"] = {
          "date": tomorrow,
          "notes": standup_notes,
          "generated_at": datetime.now().isoformat(),
      }

      memory.write_memory("state/shared_context", shared)
      result = "standup notes saved for tomorrow"
    output: standup_save_result
    on_error: continue

  # ==================== CHAIN: CLEANUP STALE BRANCHES ====================

  - name: call_cleanup_branches
    description: "Suggest cleaning up stale merged branches at end of day"
    condition: "stale_branches and len(stale_branches) > 0"
    tool: skill_run
    args:
      skill_name: cleanup_branches
      inputs: '{"dry_run": true}'
    on_error: continue

  - name: restore_persona_after_cleanup_branches
    description: "Restore developer persona after cleanup_branches"
    tool: persona_load
    args:
      persona_name: "developer"
    on_error: continue

  # ==================== LEARNING FROM FAILURES ====================

  - name: detect_beer_failures
    description: "Detect failure patterns from EOD data gathering"
    compute: |
      errors_detected = []

      # Check git failures
      git_text = str(todays_commits_raw) if 'todays_commits_raw' in dir() and todays_commits_raw else ""
      if "permission denied" in git_text.lower():
          errors_detected.append({
              "tool": "git_log",
              "pattern": "permission denied",
              "cause": "Git repository access denied",
              "fix": "Check repository permissions and SSH keys"
          })

      # Check GitLab failures
      gitlab_text = str(my_prs_raw) if 'my_prs_raw' in dir() and my_prs_raw else ""
      if "no such host" in gitlab_text.lower():
          errors_detected.append({
              "tool": "gitlab_mr_list",
              "pattern": "no such host",
              "cause": "VPN not connected - internal GitLab not reachable",
              "fix": "Run vpn_connect() to connect to Red Hat VPN"
          })

      # Check calendar failures
      calendar_text = str(tomorrow_calendar) if 'tomorrow_calendar' in dir() and tomorrow_calendar else ""
      if "oauth" in calendar_text.lower() or "token" in calendar_text.lower():
          errors_detected.append({
              "tool": "google_calendar_events",
              "pattern": "oauth token",
              "cause": "Google OAuth token expired or not configured",
              "fix": "Run setup-gmail to refresh OAuth tokens"
          })

      # Check bonfire failures
      bonfire_text = str(ephemeral_raw) if 'ephemeral_raw' in dir() and ephemeral_raw else ""
      if "no route to host" in bonfire_text.lower():
          errors_detected.append({
              "tool": "bonfire_namespace_list",
              "pattern": "no route to host",
              "cause": "VPN not connected - ephemeral cluster not reachable",
              "fix": "Run vpn_connect() and kube_login('ephemeral')"
          })

      result = errors_detected
    output: beer_errors_detected
    on_error: continue

  - name: learn_beer_vpn_failure
    description: "Learn from GitLab VPN failures"
    condition: "beer_errors_detected and any(e.get('pattern') == 'no such host' for e in beer_errors_detected)"
    tool: learn_tool_fix
    args:
      tool_name: "gitlab_mr_list"
      error_pattern: "no such host"
      root_cause: "VPN not connected - internal GitLab not reachable"
      fix_description: "Run vpn_connect() to connect to Red Hat VPN"
    output: beer_vpn_fix_learned
    on_error: continue

  - name: learn_beer_calendar_failure
    description: "Learn from Google Calendar OAuth failures"
    condition: "beer_errors_detected and any(e.get('pattern') == 'oauth token' for e in beer_errors_detected)"
    tool: learn_tool_fix
    args:
      tool_name: "google_calendar_events"
      error_pattern: "oauth token"
      root_cause: "Google OAuth token expired or not configured"
      fix_description: "Run setup-gmail to refresh OAuth tokens"
    output: beer_calendar_fix_learned
    on_error: continue

  - name: learn_beer_bonfire_failure
    description: "Learn from bonfire VPN failures"
    condition: "beer_errors_detected and any(e.get('pattern') == 'no route to host' for e in beer_errors_detected)"
    tool: learn_tool_fix
    args:
      tool_name: "bonfire_namespace_list"
      error_pattern: "no route to host"
      root_cause: "VPN not connected - ephemeral cluster not reachable"
      fix_description: "Run vpn_connect() and kube_login('ephemeral')"
    output: beer_bonfire_fix_learned
    on_error: continue

  - name: log_beer_completion
    description: "Log EOD wrap-up to session"
    tool: memory_session_log
    args:
      action: "EOD wrap-up completed"
      details: >-
        {{ todays_work.count if todays_work else 0 }} commits,
        {{ my_prs | length if my_prs else 0 }} open PRs,
        {{ today_session.entry_count if today_session else 0 }} session entries,
        {{ today_session.all_issues | length if today_session and today_session.all_issues else 0 }} issues touched
    on_error: continue

outputs:
  - name: summary
    value: "{{ briefing }}"

  - name: context
    value:
      commits_today: "{{ todays_work.count if todays_work else 0 }}"
      uncommitted_repos: "{{ uncommitted_changes | length if uncommitted_changes else 0 }}"
      open_prs: "{{ my_prs | length if my_prs else 0 }}"
      meetings_tomorrow: "{{ tomorrow_calendar | length if tomorrow_calendar else 0 }}"
      ephemeral_to_clean: "{{ ephemeral_namespaces | length if ephemeral_namespaces else 0 }}"
      stale_branches: "{{ stale_branches | length if stale_branches else 0 }}"
