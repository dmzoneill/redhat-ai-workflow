# 120-column layout, shared with pyproject.toml [tool.ruff] and ruff-format.
# Super-linter's default template also uses 120.
line-length = 120
cache-dir = "/tmp/.ruff_cache"

[lint.isort]
# Same first-party packages as .isort.cfg so ruff (I001) and isort agree.
known-first-party = ["server", "services", "tool_modules", "scripts", "tests"]
